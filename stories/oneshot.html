<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One-shot Detail | Luan's Arcane Archives</title>
  <link rel="Icon" href="../images/Icon.jpg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'], serif: ['"Noto Serif JP"', 'serif'] },
          colors: { gold: 'rgba(210,178,106, 1)' }
        }
      }
    }
  </script>
  <style>
    body{ background: #07060a; color: #e2e8f0; }
    .bg-layer{ position: fixed; inset: 0; z-index: -2; background: #0f172a; }
    .lib-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="antialiased">
  <div class="bg-layer"></div>

  <header class="sticky top-0 z-50 px-4 py-4">
    <nav class="max-w-6xl mx-auto bg-black/80 backdrop-blur border border-white/10 rounded-full px-5 py-3 flex items-center justify-between">
      <a href="../index.html" class="font-serif font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-orange-200 to-slate-200">Luan's Archives</a>
      <div class="flex gap-3 text-sm">
        <a href="index.html" class="hover:text-white transition">← Back</a>
      </div>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-20 pt-8">
    
    <nav class="flex text-xs md:text-sm text-slate-400 mb-6" aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-2">
        <li class="inline-flex items-center">
          <a href="../index.html" class="hover:text-white transition flex items-center">
             <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
             Home
          </a>
        </li>
        <li>
          <div class="flex items-center">
            <span class="mx-2 text-slate-600">/</span>
            <a href="index.html" class="hover:text-white transition">Archives</a>
          </div>
        </li>
        <li aria-current="page">
          <div class="flex items-center">
            <span class="mx-2 text-slate-600">/</span>
            <span id="breadcrumbTitle" class="text-white font-bold truncate max-w-[150px] md:max-w-xs">Loading...</span>
          </div>
        </li>
      </ol>
    </nav>
    <section id="hero" class="lib-card rounded-3xl overflow-hidden mb-10">
      <div id="heroImg" class="h-64 md:h-96 bg-cover bg-center transition-all duration-700"></div>
      <div class="p-8">
        <div class="flex items-center gap-3 mb-4">
            <span class="text-xs font-bold text-orange-300 uppercase tracking-widest border border-orange-500/30 px-2 py-1 rounded">One-shot</span>
            <span id="dateMeta" class="text-xs text-slate-500 font-mono"></span>
        </div>
        
        <h1 id="title" class="font-serif text-3xl md:text-5xl font-black text-white mb-6 leading-tight">Loading...</h1>
        
        <p id="summary" class="text-slate-300 leading-relaxed mb-8 text-lg"></p>
        
        <div id="tags" class="flex flex-wrap gap-2 mb-8"></div>
        
        <div class="flex flex-wrap gap-4">
            <a id="mainLink" href="#" target="_blank" class="inline-flex items-center px-8 py-4 bg-red-600 hover:bg-red-700 text-white rounded-full font-bold transition shadow-lg shadow-red-900/20">
                <span>▶ YouTubeで観る</span>
            </a>
            
            <a id="subLink" href="#" target="_blank" class="hidden inline-flex items-center px-6 py-4 bg-white/5 hover:bg-white/10 text-white rounded-full font-bold transition border border-white/10">
                ニコニコ動画
            </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    function getSlug(){ return new URLSearchParams(location.search).get("slug") || ""; }
    function formatDate(d){ return d ? d.replace(/-/g, '.') : ''; }

    function getYouTubeId(url) {
        if (!url) return null;
        const regExp = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        const match = url.match(regExp);
        return match ? match[1] : null;
    }

    // ▼▼▼ 画像の生存確認を行う関数 ▼▼▼
    function checkImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    async function init(){
      const slug = getSlug();
      const data = await (await fetch("./data.json")).json();
      const item = (data.oneshots || []).find(s => s.slug === slug);

      if(!item){
        $('#title').textContent = "Not Found";
        $('#breadcrumbTitle').textContent = "Not Found";
        return;
      }

      document.title = `${item.title} | Luan's Archives`;

      // ▼▼▼ サムネイル自動判定 (高画質優先ロジック) ▼▼▼
      let heroThumb = item.thumb;
      if (!heroThumb && item.url) {
          const vid = getYouTubeId(item.url);
          if (vid) {
              const maxRes = `https://img.youtube.com/vi/${vid}/maxresdefault.jpg`;
              const hqRes = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
              
              // 最高画質が存在するかチェック
              const exists = await checkImage(maxRes);
              heroThumb = exists ? maxRes : hqRes;
          }
      }
      if (!heroThumb) heroThumb = "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=1200"; 
      
      $('#heroImg').style.backgroundImage = `url('${heroThumb}')`;
      // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

      $('#dateMeta').textContent = formatDate(item.publishedAt || item.updatedAt);
      $('#title').textContent = item.title;
      $('#breadcrumbTitle').textContent = item.title; // パンくず用
      $('#summary').textContent = item.summary;
      $('#tags').innerHTML = (item.tags||[]).map(t => `<span class="px-3 py-1 bg-white/10 rounded-full text-xs">${t}</span>`).join('');
      
      const btn = $('#mainLink');
      if(item.url) btn.href = item.url;
      else btn.classList.add('hidden');

      // ニコニコなどのサブリンク
      if(item.links?.niconico) {
          $('#subLink').href = item.links.niconico;
          $('#subLink').classList.remove('hidden');
      }
    }
    init();
  </script>
</body>
</html>
