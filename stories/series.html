<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series Detail | Luan's Arcane Archives</title>
  <link rel="icon" href="../images/Icon.jpg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'], serif: ['"Noto Serif JP"', 'serif'] },
          colors: { gold: 'rgba(210,178,106, 1)' }
        }
      }
    }
  </script>
  
  <style>
    body{ background: #07060a; color: #e2e8f0; }
    .bg-layer{ position: fixed; inset: 0; z-index: -2; background: #0f172a; }
    .lib-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="antialiased">
  <div class="bg-layer"></div>

  <header class="sticky top-0 z-50 px-4 py-4">
    <nav class="max-w-6xl mx-auto bg-black/80 backdrop-blur border border-white/10 rounded-full px-5 py-3 flex items-center justify-between">
      <a href="../index.html" class="font-serif font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-orange-200 to-slate-200">Luan's Archives</a>
      <div class="flex gap-3 text-sm">
        <a href="index.html" class="hover:text-white transition">← Back</a>
      </div>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-4 pb-20 pt-8">
    
    <nav class="flex text-xs md:text-sm text-slate-400 mb-6" aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-2">
        <li class="inline-flex items-center">
          <a href="../index.html" class="hover:text-white transition flex items-center">
             <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
             Home
          </a>
        </li>
        <li>
          <div class="flex items-center">
            <span class="mx-2 text-slate-600">/</span>
            <a href="index.html" class="hover:text-white transition">Archives</a>
          </div>
        </li>
        <li aria-current="page">
          <div class="flex items-center">
            <span class="mx-2 text-slate-600">/</span>
            <span id="breadcrumbTitle" class="text-white font-bold truncate max-w-[150px] md:max-w-xs">Loading...</span>
          </div>
        </li>
      </ol>
    </nav>

    <section id="hero" class="lib-card rounded-3xl overflow-hidden mb-10">
      <div id="heroImg" class="h-64 bg-cover bg-center"></div>
      <div class="p-8">
        <div class="text-xs font-bold text-orange-300 mb-2" id="meta"></div>
        <h1 id="title" class="font-serif text-3xl md:text-4xl font-black text-white mb-4">Loading...</h1>
        <p id="summary" class="text-slate-300 leading-relaxed mb-6"></p>
        <div id="tags" class="flex flex-wrap gap-2"></div>
        <div class="mt-8">
            <a id="ytLink" href="#" target="_blank" class="inline-flex items-center px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-full font-bold transition">
                <span>▶ YouTubeで再生リストを見る</span>
            </a>
        </div>
      </div>
    </section>

    <h2 class="font-serif text-2xl font-bold text-white mb-6 pl-2 border-l-4 border-orange-300">Episodes</h2>
    <div id="episodes" class="space-y-4"></div>

    <div id="compilationWrapper" class="hidden mt-12">
      <h2 class="font-serif text-2xl font-bold text-white mb-6 pl-2 border-l-4 border-red-500">Compilations / 総集編</h2>
      <div id="compilations" class="space-y-4"></div>
    </div>
    </main>

  <script>
    const $ = (s) => document.querySelector(s);
    function getSlug(){ return new URLSearchParams(location.search).get("slug") || ""; }
    function formatDate(d){ return d ? d.replace(/-/g, '.') : ''; }

    function getYouTubeId(url) {
        if (!url) return null;
        const regExp = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
        const match = url.match(regExp);
        return match ? match[1] : null;
    }

    window.toggleSummary = function(index) {
        const textEl = document.getElementById(`desc-${index}`);
        const btnEl = document.getElementById(`btn-${index}`);
        if (textEl.classList.contains('line-clamp-2')) {
            textEl.classList.remove('line-clamp-2');
            btnEl.textContent = '閉じる';
            btnEl.classList.add('text-slate-500');
        } else {
            textEl.classList.add('line-clamp-2');
            btnEl.textContent = '...もっと見る';
            btnEl.classList.remove('text-slate-500');
        }
    };

    async function init(){
      const slug = getSlug();
      const data = await (await fetch("./data.json")).json();
      const series = (data.series || []).find(s => s.slug === slug);

      if(!series){
        $('#title').textContent = "Not Found";
        $('#breadcrumbTitle').textContent = "Not Found";
        return;
      }

      let heroThumb = series.thumb;
      if (!heroThumb && series.episodes && series.episodes.length > 0) {
          const vid = getYouTubeId(series.episodes[0].url);
          if(vid) heroThumb = `https://img.youtube.com/vi/${vid}/maxresdefault.jpg`;
      }
      $('#heroImg').style.backgroundImage = `url('${heroThumb || ""}')`;

      // ---------------------------------------------------------
      // メタデータ適用（状態、話数、総集編有無）
      // ---------------------------------------------------------
      let metaText = `${series.status.toUpperCase()} / 全${series.episodes?.length || 0}話`;
      
      // 総集編がある場合に「 / 総集編あり」を追記
      if (series.compilations && series.compilations.length > 0) {
          metaText += ` + 総集編${series.compilations?.length || 0}本`;
      }
      
      $('#meta').textContent = metaText;
      // ---------------------------------------------------------

      document.title = `${series.title} | Luan's Archives`;
      $('#title').textContent = series.title;
      $('#breadcrumbTitle').textContent = series.title;
      $('#summary').textContent = series.summary;
      $('#tags').innerHTML = (series.tags||[]).map(t => `<span class="px-3 py-1 bg-white/10 rounded-full text-xs">${t}</span>`).join('');
      
      const yt = $('#ytLink');
      if(series.links?.youtubePlaylist) yt.href = series.links.youtubePlaylist;
      else yt.classList.add('hidden');

      const epContainer = $('#episodes');
      if(!series.episodes || series.episodes.length === 0){
        epContainer.innerHTML = '<div class="p-4 text-slate-500">No episodes registered.</div>';
      } else {
        epContainer.innerHTML = series.episodes.map((ep, idx) => {
          const vid = getYouTubeId(ep.url);
          const thumbUrl = vid ? `https://img.youtube.com/vi/${vid}/mqdefault.jpg` : null;
          const hasSummary = !!ep.summary;
          
          return `
          <div class="block lib-card p-4 rounded-2xl transition group relative">
            <div class="flex flex-col sm:flex-row gap-4">
              ${thumbUrl ? `
              <a href="${ep.url || '#'}" target="_blank" class="sm:w-40 h-24 flex-shrink-0 bg-cover bg-center rounded-lg border border-white/10 hover:opacity-80 transition" 
                   style="background-image:url('${thumbUrl}')"></a>
              ` : ''}
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-xs text-orange-300 font-bold">#${ep.no}</span>
                    ${ep.publishedAt ? `<span class="text-[10px] text-slate-500 font-mono border border-white/10 px-1 rounded">${formatDate(ep.publishedAt)}</span>` : ''}
                </div>
                <a href="${ep.url || '#'}" target="_blank" class="text-lg font-bold text-white truncate hover:text-orange-200 transition block mb-2">
                    ${ep.title} <span class="text-xs ml-1 text-slate-500">▶</span>
                </a>
                ${hasSummary ? `
                    <div class="relative">
                        <p id="desc-${idx}" class="text-sm text-slate-400 leading-relaxed line-clamp-2 transition-all duration-300">
                            ${ep.summary}
                        </p>
                        <button id="btn-${idx}" onclick="toggleSummary('${idx}')" class="text-xs text-indigo-400 hover:text-indigo-300 font-bold mt-1 focus:outline-none">
                            ...もっと見る
                        </button>
                    </div>
                ` : ''}
              </div>
            </div>
          </div>
        `}).join('');
      }

      // 総集編の描画
      const compContainer = $('#compilations');
      const compWrapper = $('#compilationWrapper');

      if (series.compilations && series.compilations.length > 0) {
        compWrapper.classList.remove('hidden');
        compContainer.innerHTML = series.compilations.map((ep, idx) => {
          const vid = getYouTubeId(ep.url);
          const thumbUrl = vid ? `https://img.youtube.com/vi/${vid}/mqdefault.jpg` : null;
          const hasSummary = !!ep.summary;
          const uniqueId = `comp-${idx}`;
          
          return `
          <div class="block lib-card p-4 rounded-2xl transition group relative border-l-2 border-red-500/50">
            <div class="flex flex-col sm:flex-row gap-4">
              ${thumbUrl ? `
              <a href="${ep.url || '#'}" target="_blank" class="sm:w-40 h-24 flex-shrink-0 bg-cover bg-center rounded-lg border border-white/10 hover:opacity-80 transition" 
                   style="background-image:url('${thumbUrl}')"></a>
              ` : ''}
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-xs text-red-400 font-bold">総集編</span>
                    ${ep.publishedAt ? `<span class="text-[10px] text-slate-500 font-mono border border-white/10 px-1 rounded">${formatDate(ep.publishedAt)}</span>` : ''}
                </div>
                <a href="${ep.url || '#'}" target="_blank" class="text-lg font-bold text-white truncate hover:text-red-300 transition block mb-2">
                    ${ep.title} <span class="text-xs ml-1 text-slate-500">▶</span>
                </a>
                ${hasSummary ? `
                    <div class="relative">
                        <p id="desc-${uniqueId}" class="text-sm text-slate-400 leading-relaxed line-clamp-2 transition-all duration-300">
                            ${ep.summary}
                        </p>
                        <button id="btn-${uniqueId}" onclick="toggleSummary('${uniqueId}')" class="text-xs text-indigo-400 hover:text-indigo-300 font-bold mt-1 focus:outline-none">
                            ...もっと見る
                        </button>
                    </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;}).join('');
      }
    }
    init();
  </script>
</body>
</html>
