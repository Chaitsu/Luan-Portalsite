<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series | Luan's Arcane Archives</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            serif: ['"Noto Serif JP"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root{
      --ink: 226 232 240;
      --muted: 148 163 184;
      --bg0: 7 6 10;
      --wine: 88 12 26;
      --scarlet: 160 20 50;
      --gold: 210 178 106;
    }
    body{ color: rgb(var(--ink)); background: rgb(var(--bg0)); }
    .bg-fixed-layer{
      position: fixed; inset: 0; z-index:-2;
      background-image:
        radial-gradient(900px 520px at 18% 35%, rgba(var(--scarlet), .20), transparent 60%),
        radial-gradient(750px 450px at 72% 25%, rgba(var(--gold), .12), transparent 55%),
        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=2400&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      filter: saturate(1.05) contrast(1.05);
    }
    .bg-overlay{
      position: fixed; inset:0; z-index:-1;
      background:
        linear-gradient(to bottom, rgba(10, 6, 10, .55), rgba(7, 6, 10, .92)),
        radial-gradient(1200px 720px at 50% 80%, rgba(var(--wine), .28), transparent 60%);
      backdrop-filter: blur(5px);
    }
    .lib-card{
      border: 1px solid rgba(var(--gold), .16);
      background: rgba(255,255,255,.045);
      box-shadow: 0 22px 60px rgba(0,0,0,.50);
    }
    .lib-card:hover{
      border-color: rgba(var(--gold), .28);
      background: rgba(255,255,255,.06);
    }
  </style>
<link rel="stylesheet" href="../assets/theme.css">

</head>

<body class="antialiased">
  <div class="bg-fixed-layer"></div>
  <div class="bg-overlay"></div>

  <header class="sticky top-0 z-50 px-4 py-4">
    <nav class="max-w-6xl mx-auto bg-black/45 backdrop-blur-md border border-white/10 rounded-3xl px-5 py-4 flex items-center justify-between">
      <!-- ✅ ルートへ -->
      <a href="../index.html" class="font-serif font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[rgb(var(--gold))] to-slate-200">
        Luan's Arcane Archives
      </a>
      <div class="flex gap-2">
        <!-- ✅ 同階層 -->
        <a href="index.html" class="px-4 py-2 rounded-2xl bg-white/5 hover:bg-white/10 transition text-sm">← 一覧へ</a>
        <!-- ✅ ルート -->
        <a href="../index.html" class="px-4 py-2 rounded-2xl bg-white/5 hover:bg-white/10 transition text-sm">Home</a>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 pb-20">
    <section id="hero" class="mt-6 lib-card rounded-3xl overflow-hidden">
      <div id="heroImg" class="h-56 md:h-72 bg-cover bg-center opacity-90"></div>
      <div class="p-6 md:p-8">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div id="meta" class="text-sm text-slate-300"></div>
            <h1 id="title" class="mt-1 font-serif text-3xl md:text-4xl font-black text-white">Loading...</h1>
          </div>
          <a id="yt" href="#" target="_blank"
             class="px-5 py-3 rounded-2xl font-bold text-black bg-[rgba(210,178,106,.95)] hover:opacity-90 transition">
            YouTubeで見る →
          </a>
        </div>

        <p id="summary" class="mt-4 text-slate-200/90 leading-relaxed"></p>
        <div id="tags" class="mt-4 flex flex-wrap gap-2"></div>
      </div>
    </section>

    <section class="mt-6 lib-card rounded-3xl p-6 md:p-8">
      <h2 class="font-serif text-2xl font-black text-white">Episodes</h2>
      <p class="text-slate-300 text-sm mt-1">※ URLが入っているものだけリンクになります。</p>
      <div id="episodes" class="mt-5 grid gap-3"></div>
    </section>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);

    function getSlug(){
      const p = new URLSearchParams(location.search);
      return p.get("slug") || "";
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    async function loadData(){
      // ✅ 同階層
      const res = await fetch("./data.json", { cache:"no-store" });
      if(!res.ok) throw new Error("failed to load data.json");
      return res.json();
    }

    function badge(status){
      const map = { ongoing:"進行中", completed:"完結", oneshot:"単発" };
      return map[status] || status;
    }

    function render(series){
      document.title = `${series.title} | Luan's Arcane Archives`;

      $("#heroImg").style.backgroundImage = `url('${series.thumb || ""}')`;
      $("#meta").textContent = `${badge(series.status)} / ${series.group || ""}`;
      $("#title").textContent = series.title || "";
      $("#summary").textContent = series.summary || "";

      const tags = (series.tags || []).map(t =>
        `<span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs">${escapeHtml(t)}</span>`
      ).join("");
      $("#tags").innerHTML = tags;

      const yt = $("#yt");
      yt.href = (series.links && series.links.youtubePlaylist) ? series.links.youtubePlaylist : "https://www.youtube.com/";
      if(!yt.href) yt.classList.add("hidden");

      const episodes = series.episodes || [];
      if(episodes.length === 0){
        $("#episodes").innerHTML = `
          <div class="rounded-2xl bg-white/5 border border-white/10 p-5 text-slate-200">
            まだエピソードが登録されていません。data.json の episodes に追加してください。
          </div>
        `;
        return;
      }

      $("#episodes").innerHTML = episodes.map(ep => {
        const title = escapeHtml(ep.title || `Episode ${ep.no ?? ""}`);
        const no = ep.no != null ? `#${ep.no}` : "";
        const url = ep.url || "";
        if(url){
          return `
            <a href="${url}" target="_blank" class="block rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 transition p-5">
              <div class="text-xs text-slate-300">${no}</div>
              <div class="font-bold text-white mt-1">${title}</div>
              <div class="text-sm text-[rgb(210,178,106)] mt-2">視聴する →</div>
            </a>
          `;
        }
        return `
          <div class="rounded-2xl bg-white/5 border border-white/10 p-5">
            <div class="text-xs text-slate-300">${no}</div>
            <div class="font-bold text-white mt-1">${title}</div>
          </div>
        `;
      }).join("");
    }

    (async function init(){
      const slug = getSlug();
      const data = await loadData();
      const list = data.series || [];
      const series = list.find(s => s.slug === slug);

      if(!series){
        $("#title").textContent = "シリーズが見つかりません";
        $("#summary").textContent = "URLの slug が正しいか、data.json に登録されているか確認してください。";
        $("#yt").classList.add("hidden");
        $("#episodes").innerHTML = `
          <!-- ✅ -->
          <a href="index.html" class="inline-flex mt-4 px-5 py-3 rounded-2xl bg-[rgba(210,178,106,.95)] text-black font-bold hover:opacity-90 transition">
            一覧へ戻る →
          </a>
        `;
        return;
      }

      render(series);
    })().catch(err => {
      console.error(err);
      $("#title").textContent = "読み込みに失敗しました";
      $("#summary").textContent = "./data.json が見つからない可能性があります。";
      $("#yt").classList.add("hidden");
    });
  </script>
</body>
</html>
