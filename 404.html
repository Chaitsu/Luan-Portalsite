<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Luan's Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="images/Icon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'], serif: ['"Noto Serif JP"', 'serif'] },
                }
            }
        }
    </script>
    <style>
        body{ background: #07060a; color: #e2e8f0; }
        .bg-layer{ position: fixed; inset: 0; z-index: -2; background-image: url('https://images.unsplash.com/photo-1535905557558-afc4877a26fc?q=80'); background-size: cover; background-position: center; filter: brightness(0.4); }
        .glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <div class="bg-layer"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-900/30 rounded-full blur-3xl -z-10"></div>

    <div class="glass max-w-lg w-full p-10 rounded-3xl text-center shadow-2xl">
        <h1 class="font-serif text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 to-purple-200 mb-4">404</h1>
        <h2 class="text-xl font-bold text-white mb-4">ページが見つかりません</h2>
        <p class="text-slate-400 mb-8 leading-relaxed">
            お探しのページは削除されたか、<br>
            最初から存在しなかったようです。<br>
            あるいは、幻想郷の彼方へ消えたのかもしれません。
        </p>
        <a href="/index.html" class="inline-block px-8 py-3 rounded-full bg-white text-black font-bold hover:bg-indigo-50 text-sm transition transform hover:scale-105">
            トップページへ戻る
        </a>
    </div>
</body>
</html>
